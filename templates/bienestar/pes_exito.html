{% extends "bienestar/base.html" %}

{% block title %}
Declaración registrada | Bienestar
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-6 col-md-8">

        <div class="app-card">

            <div class="card-padding text-center">

                <div
                    style="
                        font-size: 65px;
                        margin-bottom: 15px;
                    "
                >
                    🛡️
                </div>

                <h2 class="fw-bold mb-3">

                    Declaración registrada

                </h2>

                <p class="text-muted mb-4">

                    Tu información fue registrada correctamente.

                </p>

                <div
                    class="
                        p-3
                        rounded-4
                        mb-4
                    "
                    style="
                        background: #ecfdf3;
                        color: #027a48;
                        border: 1px solid #abefc6;
                    "
                >

                    <i class="bi bi-check-circle-fill me-2"></i>

                    Registro completado correctamente.

                </div>

                <a
                    href="{% url 'inicio' %}"
                    class="btn btn-send w-100"
                >

                    <i class="bi bi-house-door-fill"></i>

                    Volver al inicio

                </a>

            </div>

        </div>

    </div>

</div>

{% endblock %}
